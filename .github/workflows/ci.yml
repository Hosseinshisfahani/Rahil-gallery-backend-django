name: Django CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migration ownership gate
        run: bash scripts/check_migration_ownership.sh django .

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "true"
          JWT_ACCESS_SECRET: ci-jwt-secret-at-least-32-characters
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rahil_gallery?sslmode=disable
        run: python manage.py check

      - name: Unit tests (auth bridge)
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "true"
          JWT_ACCESS_SECRET: unit-test-secret-at-least-32-chars!!
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rahil_gallery?sslmode=disable
        run: python manage.py test identity.tests --verbosity=1
